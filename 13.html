<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla PFP Maker</title>
    <style>
        :root {
            /* Palette */
            --bg-blue-light: #4c82ff;
            --bg-blue-dark: #2a55d9;
            --banana-yellow: #ffe135;
            --banana-shadow: #d4b200;
            --border-color: #000000;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-blue-light), var(--bg-blue-dark));
            background-attachment: fixed;
            color: var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(var(--bg-blue-light) 20%, transparent 20%),
                              radial-gradient(var(--bg-blue-dark) 20%, transparent 20%);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-shadow: 
                4px 4px 0px #000, 
                -1px -1px 0 #000,  
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
            letter-spacing: 2px;
            margin-bottom: 5px;
            transform: skew(-5deg);
        }

        p {
            color: white;
            font-weight: 600;
            text-shadow: 2px 2px 0px #000;
            font-size: 1.1rem;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* --- 3D CANVAS FRAME --- */
        .preview-area {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .canvas-wrapper {
            width: 400px;
            height: 400px;
            background-color: #fff;
            border-radius: 30px;
            border: 6px solid var(--border-color);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4); 
            overflow: hidden;
            position: relative;
            /* Placeholder pattern until canvas loads */
            background-image: radial-gradient(#e0e7ff 10%, transparent 10%);
            background-size: 20px 20px;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            border: 4px solid var(--border-color);
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            transition: all 0.1s;
            box-shadow: 5px 5px 0px var(--border-color); 
        }

        button.action-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .btn-download {
            background-color: var(--banana-yellow);
            color: var(--border-color);
        }
        .btn-download:hover { background-color: #ffea70; }

        .btn-random {
            background-color: #ffffff;
            color: var(--border-color);
        }
        .btn-random:hover { background-color: #f0f0f0; }

        /* --- CONTROLS AREA (Resized) --- */
        .controls-area {
            flex: 1;
            min-width: 320px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 20px;
            border: 6px solid var(--border-color);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4);
            /* Reduced Height */
            height: 520px; 
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-blue-light) transparent;
        }
        .tabs::-webkit-scrollbar { 
            height: 6px;
            display: block;
        }
        .tabs::-webkit-scrollbar-track { background: transparent; }
        .tabs::-webkit-scrollbar-thumb { 
            background: var(--bg-blue-light); 
            border-radius: 3px;
        }

        .tab-btn {
            background: white;
            border: 3px solid var(--border-color);
            color: var(--border-color);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: all 0.2s;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 5px 5px 0px var(--border-color);
        }

        .tab-btn.active {
            background-color: var(--bg-blue-dark);
            color: white;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.3);
            transform: translateY(2px);
        }

        .assets-grid {
            display: grid;
            /* Slightly smaller items to fit more */
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding: 5px;
            flex-grow: 1;
        }

        .assets-grid::-webkit-scrollbar { width: 10px; }
        .assets-grid::-webkit-scrollbar-track { background: transparent; }
        .assets-grid::-webkit-scrollbar-thumb { 
            background: var(--bg-blue-light); 
            border: 2px solid white;
            border-radius: 10px;
        }

        .asset-item {
            aspect-ratio: 1;
            background-color: #f4f4f5;
            border-radius: 12px;
            border: 3px solid var(--border-color);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.1s;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        .asset-item img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            transition: transform 0.2s;
        }

        .asset-item:hover {
            transform: translateY(-2px);
            box-shadow: 5px 5px 0px var(--border-color);
        }
        
        .asset-item:hover img { transform: scale(1.1); }

        .asset-item.selected {
            background-color: var(--banana-yellow);
            border-color: var(--border-color);
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.2);
            transform: translateY(2px);
        }

        .none-option {
            font-weight: bold;
            color: #aaa;
            font-size: 1.2rem;
        }
        .asset-item.selected.none-option {
            color: var(--border-color);
        }

        @media (max-width: 800px) {
            .canvas-wrapper { width: 300px; height: 300px; }
            .controls-area { height: auto; max-height: 450px; }
            h1 { font-size: 2.2rem; }
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            
            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .preview-area {
                width: 100%;
                max-width: 350px;
            }
            
            .canvas-wrapper {
                width: 280px;
                height: 280px;
                border-width: 4px;
                box-shadow: 6px 6px 0px rgba(0,0,0,0.4);
            }
            
            .controls-area {
                width: 100%;
                max-width: 350px;
                height: 400px;
                padding: 15px;
                border-width: 4px;
                box-shadow: 6px 6px 0px rgba(0,0,0,0.4);
            }
            
            h1 { 
                font-size: 1.8rem;
                margin-bottom: 10px;
            }
            
            p { 
                font-size: 0.9rem;
                margin-bottom: 15px;
            }
            
            .action-buttons {
                gap: 8px;
            }
            
            button.action-btn {
                padding: 10px 8px;
                font-size: 0.8rem;
                border-width: 3px;
                box-shadow: 3px 3px 0px var(--border-color);
            }
            
            button.action-btn:active {
                transform: translate(2px, 2px);
                box-shadow: 1px 1px 0px var(--border-color);
            }
            
            .tabs {
                gap: 6px;
                margin-bottom: 15px;
                flex-wrap: wrap;
                overflow-x: visible;
            }
            
            .tab-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                border-width: 2px;
                box-shadow: 2px 2px 0px var(--border-color);
            }
            
            .tab-btn:hover {
                transform: translateY(-1px);
                box-shadow: 3px 3px 0px var(--border-color);
            }
            
            .tab-btn.active {
                box-shadow: inset 2px 2px 0px rgba(0,0,0,0.3);
                transform: translateY(1px);
            }
            
            .assets-grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 8px;
                padding: 3px;
            }
            
            .asset-item {
                border-width: 2px;
                border-radius: 8px;
                box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            }
            
            .asset-item:hover {
                transform: translateY(-1px);
                box-shadow: 3px 3px 0px var(--border-color);
            }
            
            .asset-item.selected {
                box-shadow: inset 2px 2px 0px rgba(0,0,0,0.2);
                transform: translateY(1px);
            }
            
            .none-option {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 400px) {
            .canvas-wrapper {
                width: 250px;
                height: 250px;
            }
            
            .controls-area {
                height: 350px;
                padding: 12px;
            }
            
            h1 { font-size: 1.5rem; }
            
            .assets-grid {
                grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
                gap: 6px;
            }
            
            button.action-btn {
                padding: 8px 6px;
                font-size: 0.7rem;
            }
            
            .tab-btn {
                padding: 5px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>PFP CREATOR</h1>
        <p>Customize your Gorilla!</p>
    </header>

    <div class="main-container">
        <!-- Left Side: Canvas -->
        <div class="preview-area">
            <div class="canvas-wrapper">
                <canvas id="avatarCanvas" width="1000" height="1000"></canvas>
            </div>
            <div class="action-buttons">
                <button class="action-btn btn-random" onclick="randomize()">🎲 Random</button>
                <button class="action-btn btn-download" onclick="downloadImage()">🍌 Save</button>
            </div>
        </div>

        <!-- Right Side: Controls -->
        <div class="controls-area">
            <div class="tabs" id="categoryTabs">
                <!-- Tabs generated by JS -->
            </div>
            <div class="assets-grid" id="assetGrid">
                <!-- Images generated by JS -->
            </div>
        </div>
    </div>

    <script>
        // --- DATA CONFIGURATION ---
        // تم تغيير الأسماء إلى أسماء وهمية كما طلبت
        // تم إضافة قسم الخلفيات Backgrounds
        const categories = {
            background: {
                label: "Background",
                required: false, // If false, defaults to blue color
                items: [
                    "backgrounds/1.png",
                    "backgrounds/2.png",
                    "backgrounds/3.png",
                    "backgrounds/4.png",
                    "backgrounds/5.png",
                    "backgrounds/6.png",
                    "backgrounds/7.png",
                    "backgrounds/8.png",
                    "backgrounds/9.png",
                    "backgrounds/10.png",
                    "backgrounds/11.png",
                    "backgrounds/12.png"
                    
                ]
            },
            body: {
                label: "Body",
                required: true,
                items: [
                    "body/IMG_4090.PNG",
                    "body/IMG_4092.PNG"
                ]
            },
            clothes: {
                label: "Clothes",
                required: false,
                items: [
                    "clothes/IMG_4027.PNG",
                    "clothes/IMG_4093.PNG",
                    "clothes/IMG_4095.PNG",
                    "clothes/IMG_4096.PNG",
                    "clothes/IMG_4100.PNG",
                    "clothes/IMG_4101.PNG"
                ]
            },
            cap: {
                label: "Cap",
                required: false,
                items: [
                    "cap/IMG_4109.PNG",
                    "cap/IMG_4110.PNG",
                    "cap/IMG_4111.PNG",
                    "cap/IMG_4114.PNG",
                    "cap/IMG_4123.PNG",
                    "cap/IMG_4124.PNG",
                    "cap/IMG_4127.PNG",
                    "cap/IMG_4131.PNG",
                    "cap/IMG_4136.PNG"
                ]
            },
            accessory: {
                label: "Glasses",
                required: false,
                items: [
                    "Accessory/IMG_4104.PNG",
                    "Accessory/IMG_4105.PNG",
                    "Accessory/IMG_4107.PNG",
                    "Accessory/IMG_4108.PNG",
                    "Accessory/IMG_4132.PNG",
                    "Accessory/IMG_4134.PNG",
                    "Accessory/IMG_4135.PNG"
                ]
            },
            other: {
                label: "Misc",
                required: false,
                items: [
                    "other/IMG_4115.PNG",
                    "other/IMG_4117.PNG",
                    "other/IMG_4118.PNG",
                    "other/IMG_4119.PNG",
                    "other/IMG_4120.PNG",
                    "other/IMG_4121.PNG"
                ]
            }
        };

        // Z-Index Order: Background -> Body -> Clothes -> Other -> Accessory -> Cap
        const layerOrder = ['background', 'body', 'clothes', 'other', 'accessory', 'cap'];

        const currentSelection = {
            background: null,
            body: 0, 
            clothes: null,
            cap: null,
            accessory: null,
            other: null
        };

        let currentTab = 'body'; // Start tab

        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        const tabsContainer = document.getElementById('categoryTabs');
        const gridContainer = document.getElementById('assetGrid');

        // --- INITIALIZATION ---
        function init() {
            createTabs();
            renderGrid(currentTab);
            // Wait for fonts/DOM then draw
            setTimeout(drawAvatar, 100); 
        }

        // --- DRAWING LOGIC ---
        function drawAvatar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Blue Background on the canvas itself (optional, matches theme)
            ctx.fillStyle = "#4c82ff";
            ctx.fillRect(0,0, canvas.width, canvas.height);

            let p = Promise.resolve();
            layerOrder.forEach(categoryKey => {
                p = p.then(() => {
                    return new Promise((resolve) => {
                        const selectedIndex = currentSelection[categoryKey];
                        if (selectedIndex === null) return resolve();

                        const imgPath = categories[categoryKey].items[selectedIndex];
                        const img = new Image();
                        img.src = imgPath;
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve();
                        };
                        img.onerror = resolve;
                    });
                });
            });
        }

        // --- UI GENERATION ---
        function createTabs() {
            tabsContainer.innerHTML = '';
            layerOrder.forEach(key => {
                const cat = categories[key];
                const btn = document.createElement('button');
                btn.className = `tab-btn ${key === currentTab ? 'active' : ''}`;
                btn.innerText = cat.label;
                btn.onclick = () => switchTab(key);
                tabsContainer.appendChild(btn);
            });
        }

        function switchTab(key) {
            currentTab = key;
            // Update UI classes
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const buttons = Array.from(document.querySelectorAll('.tab-btn'));
            const activeBtn = buttons.find(b => b.innerText === categories[key].label);
            if(activeBtn) activeBtn.classList.add('active');
            
            renderGrid(key);
        }

        function renderGrid(categoryKey) {
            gridContainer.innerHTML = '';
            const category = categories[categoryKey];

            // Add "None" option if not required
            if (!category.required) {
                const noneDiv = document.createElement('div');
                noneDiv.className = `asset-item none-option ${currentSelection[categoryKey] === null ? 'selected' : ''}`;
                noneDiv.innerText = "✖"; 
                noneDiv.onclick = () => selectItem(categoryKey, null);
                gridContainer.appendChild(noneDiv);
            }

            // Add items
            category.items.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = `asset-item ${currentSelection[categoryKey] === index ? 'selected' : ''}`;
                
                const img = document.createElement('img');
                img.src = src;
                
                div.appendChild(img);
                div.onclick = () => selectItem(categoryKey, index);
                gridContainer.appendChild(div);
            });
        }

        function selectItem(category, index) {
            currentSelection[category] = index;
            renderGrid(category);
            drawAvatar();
        }

        function randomize() {
            layerOrder.forEach(key => {
                const items = categories[key].items;
                const isRequired = categories[key].required;
                
                // 30% chance to be empty if not required
                if (!isRequired && Math.random() < 0.3) {
                    currentSelection[key] = null;
                } else {
                    const randomIndex = Math.floor(Math.random() * items.length);
                    currentSelection[key] = randomIndex;
                }
            });
            renderGrid(currentTab);
            drawAvatar();
        }

        function downloadImage() {
            try {
                const link = document.createElement('a');
                link.download = 'gorilla-pfp.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                alert("Please open this file with a local server (like Live Server in VS Code) to enable downloading. The images work but downloading requires a server due to browser security.");
                console.error("Download error:", e);
            }
        }

        init();
    </script>
</body>
</html>
